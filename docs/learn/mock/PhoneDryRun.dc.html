<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Phone: dry run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3346c4}a:hover{color:#26338f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #fefefe; color: #131a2e; font-family: 'Noto Sans', 'Noto Sans Devanagari', system-ui, sans-serif">
  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #ffffff; border-bottom: 1px solid #e2e6ef">
    <a href="PhoneHome.dc.html" aria-label="Wapas" style="width: 44px; height: 44px; display: grid; place-items: center; color: #373f52"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <div style="flex: 1"><div style="font-weight: 700">Dry run: two pointers</div><div style="font-size: 12px; color: #5f687c">a = [1, 3, 4, 6, 8, 11], K = 10</div></div>
  </header>
  <div style="flex: 1; overflow-y: auto; padding: 22px 14px">
    <div style="text-align: center; font-family: 'Kalam', cursive; font-size: 20px; color: #111111; margin-bottom: 14px">kadam {{stepNo}} / 5</div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; font-family: 'Kalam', cursive; color: #111111">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="width: 100%; aspect-ratio: 1; border: 2.5px solid #111111; border-radius: 6px; display: grid; place-items: center; font-size: 24px; font-weight: 700; transform: rotate({{c.tilt}}); box-sizing: border-box; {{c.fill}}">{{c.v}}</div>
          <div style="height: 26px; font-size: 18px">{{c.ptr}}</div>
        </div>
      </sc-for>
    </div>
    <p style="font-family: 'Kalam', cursive; font-size: 22px; line-height: 1.35; color: #111111; text-align: center; margin: 14px 4px 18px; min-height: 90px">{{note}}</p>

    <sc-if value="{{askOn}}" hint-placeholder-val="{{ true }}">
      <div style="padding: 14px; border-radius: 14px; background: #f1f3fe">
        <div style="font-weight: 700; margin-bottom: 10px">Pehle socho: agle kadam me kaun hilega?</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" onClick="{{guessL}}" style="min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; {{gLStyle}}">L aage</button>
          <button type="button" onClick="{{guessR}}" style="min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; {{gRStyle}}">R peeche</button>
        </div>
        <sc-if value="{{guessed}}" hint-placeholder-val="{{ false }}">
          <div style="margin-top: 10px; font-size: 14px; font-weight: 600; {{gFb}}">{{guessText}}</div>
        </sc-if>
      </div>
    </sc-if>
  </div>
  <div style="flex: 0 0 auto; padding: 12px 16px 20px; background: #ffffff; border-top: 1px solid #e2e6ef; display: flex; gap: 10px; align-items: center">
    <button type="button" onClick="{{prev}}" disabled="{{atStart}}" style="flex: 0 0 56px; height: 54px; border-radius: 14px; border: 1px solid #cdd3df; background: #ffffff; display: grid; place-items: center; cursor: pointer" aria-label="Pichhla kadam"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#131a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <sc-if value="{{notEnd}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{next}}" style="flex: 1; height: 54px; border-radius: 14px; border: 0; background: #3346c4; color: #ffffff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Agla kadam</button>
    </sc-if>
    <sc-if value="{{atEnd}}" hint-placeholder-val="{{ false }}">
      <a href="PhoneProblem.dc.html" style="flex: 1; height: 54px; border-radius: 14px; background: #f28c28; color: #131a2e; font-size: 17px; font-weight: 700; display: grid; place-items: center; text-decoration: none">Ab problem khud karo</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, guess: null };
  }
  renderVals() {
    const a = [1, 3, 4, 6, 8, 11];
    const frames = [
      { L: 0, R: 5, note: '1 + 11 = 12, K se bada.', move: 'R' },
      { L: 0, R: 4, note: '1 + 8 = 9, K se chhota.', move: 'L' },
      { L: 1, R: 4, note: '3 + 8 = 11, bada.', move: 'R' },
      { L: 1, R: 3, note: '3 + 6 = 9, chhota.', move: 'L' },
      { L: 2, R: 3, note: '4 + 6 = 10. Mil gaya: index 2 aur 3!', move: '' }
    ];
    const st = this.state.step;
    const f = frames[st];
    const tilts = ['-1.5deg', '1deg', '-0.5deg', '1.2deg', '-1deg', '0.8deg'];
    const cells = a.map((v, i) => {
      let fill = 'background: #ffffff';
      if (i === f.L || i === f.R) fill = st === 4 ? 'background: #b9e2cf' : 'background: #F6A496';
      else if (i < f.L || i > f.R) fill = 'background: repeating-linear-gradient(45deg, #cdd3df 0 2px, transparent 2px 7px); color: #5f687c';
      return { v, fill, tilt: tilts[i], ptr: i === f.L ? '↑L' : i === f.R ? '↑R' : '' };
    });
    const g = this.state.guess;
    const right = g === f.move;
    const on = 'border: 2px solid #3346c4; background: #ffffff; color: #131a2e';
    const off = 'border: 2px solid #e2e6ef; background: #ffffff; color: #131a2e';
    return {
      cells, note: f.note, stepNo: st + 1,
      askOn: st < 4, guessed: g !== null,
      gLStyle: g === 'L' ? on : off, gRStyle: g === 'R' ? on : off,
      guessL: () => this.setState({ guess: 'L' }),
      guessR: () => this.setState({ guess: 'R' }),
      guessText: right ? 'Sahi! Agla kadam dabake dekho.' : 'Socho: jod bada hai to bade number ko hatana hai ya chhote ko?',
      gFb: right ? 'color: #0d5c42' : 'color: #9c2d21',
      atStart: st === 0, atEnd: st === 4, notEnd: st < 4,
      prev: () => this.setState({ step: Math.max(0, st - 1), guess: null }),
      next: () => this.setState({ step: Math.min(4, st + 1), guess: null })
    };
  }
}
</script>
</body>
</html>
