# A complete Parikshaa for local use and small deployments.
#
# Postgres holds the ledger; one Node process serves the API and both client
# bundles, so there is no second origin to configure.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parikshaa
      POSTGRES_USER: parikshaa_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - parikshaa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parikshaa_owner -d parikshaa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrates as the schema owner, then lets the runtime role log in.
  migrate:
    build: .
    command: ["npm", "run", "migrate", "-w", "@parikshaa/store"]
    environment:
      DATABASE_URL: postgres://parikshaa_owner:${POSTGRES_PASSWORD}@db:5432/parikshaa
      PARIKSHAA_APP_PASSWORD: ${PARIKSHAA_APP_PASSWORD:?set PARIKSHAA_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Runs as parikshaa_app, not the owner: row-level security binds the runtime
  # role, and the owner would bypass it.
  api:
    build: .
    environment:
      DATABASE_URL: postgres://parikshaa_app:${PARIKSHAA_APP_PASSWORD}@db:5432/parikshaa
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      ATTEMPT_TOKEN_SECRET: ${ATTEMPT_TOKEN_SECRET:?set ATTEMPT_TOKEN_SECRET (32+ characters)}
      # Wraps each attempt's data key; candidates' answers are sealed under them.
      # Keep it out of the database's backups, and never lose it.
      PARIKSHAA_DATA_KEY: ${PARIKSHAA_DATA_KEY:?set PARIKSHAA_DATA_KEY (openssl rand -base64 32)}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL (where candidates open their links)}
      # Optional: email over SMTP and SMS through MSG91. Without them, invitations
      # are recorded as not sent, and links can be exported instead.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      # Optional: selling prepaid credits (Razorpay) and issuing GST invoices.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PARIKSHAA_SUPPLIER_NAME: ${PARIKSHAA_SUPPLIER_NAME:-}
      PARIKSHAA_SUPPLIER_GSTIN: ${PARIKSHAA_SUPPLIER_GSTIN:-}
      PARIKSHAA_SUPPLIER_ADDRESS: ${PARIKSHAA_SUPPLIER_ADDRESS:-}
      # Optional: institutions signing themselves up, for a pilot (docs/PILOT.md).
      # SELF_SIGNUP=on needs SIGNUP_PRICE_RUPEES and SMTP_URL.
      SELF_SIGNUP: ${SELF_SIGNUP:-}
      SIGNUP_PRICE_RUPEES: ${SIGNUP_PRICE_RUPEES:-}
      SIGNUP_TRIAL_CREDITS: ${SIGNUP_TRIAL_CREDITS:-}
      SIGNUP_NOTIFY_EMAIL: ${SIGNUP_NOTIFY_EMAIL:-}
      PILOT_REPORT: ${PILOT_REPORT:-}
      # Behind a reverse proxy on the same host (as in docs/PILOT.md): the client's address comes from it.
      TRUST_PROXY: ${TRUST_PROXY:-}
      RUNNER_URL: http://runner:4000
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN (32+ characters)}
      PORT: "3000"
    ports:
      # Behind a reverse proxy on the same machine, publish on 127.0.0.1:3000 only
      # (setup-server.sh does): Docker's published ports go around ufw.
      - "${API_ADDRESS:-3000}:3000"
    networks: [default, sandbox]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs candidate code (ROADMAP §4). Under gVisor, on a network with no route
  # out: it can be reached by the API and can reach nothing, not even the
  # database. Needs gVisor installed on the host (https://gvisor.dev/docs/user_guide/install/).
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    runtime: runsc
    environment:
      RUNNER_ISOLATION: gvisor
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN (32+ characters)}
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 4g
    pids_limit: 1024
    cpus: 4

volumes:
  parikshaa-data:

networks:
  default: {}
  # Internal: no gateway, so nothing on it can reach the internet.
  sandbox:
    internal: true
