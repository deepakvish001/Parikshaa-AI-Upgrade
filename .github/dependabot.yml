# ROADMAP §11: dependency updates arrive as pull requests, where CI checks them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: development
    ignore:
      # Playwright 1.65.0's Firefox (159) crashes the page while axe checks it
      # (10 Nov 2026: 17 e2e tests, every time; 1.64.1's Firefox 157 runs the
      # same tests and axe 4.14 clean). Pinned at 1.64.1; try the next release.
      - dependency-name: "@playwright/test"
        versions: ["1.65.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
