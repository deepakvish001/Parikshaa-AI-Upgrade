# ROADMAP §11: dependency updates arrive as pull requests, where CI checks them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: development
    ignore:
      # jsdom 30.1.2 stops a click from moving focus into the console editor's
      # question box under test (12 Oct 2026), so the tests type into the wrong
      # field. Browsers are not affected. Pinned at 30.1.1 (also in the root package.json's
      # overrides, for the copy vitest brings); try the next release.
      - dependency-name: jsdom
        versions: ["30.1.2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
