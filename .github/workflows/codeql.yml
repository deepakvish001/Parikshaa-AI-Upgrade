name: CodeQL

# ROADMAP §11: static analysis of the TypeScript for the classes of bug a
# security review asks about — injection, path traversal, SSRF, prototype
# pollution — on every change and weekly against new queries.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # Uploading results needs GitHub Advanced Security on a private repository,
  # and errors out without it. It runs on public repositories, or once the
  # repository variable CODE_SCANNING is set to 'true'.
  analyze:
    if: >-
      !github.event.repository.private || vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
