name: CodeQL

# ROADMAP §11: static analysis of the TypeScript for the classes of bug a
# security review asks about — injection, path traversal, SSRF, prototype
# pollution — on every change and weekly against new queries.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
