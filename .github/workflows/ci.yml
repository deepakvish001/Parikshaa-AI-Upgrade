name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks every package, test files included.
      - run: npm run typecheck

      # The store and api suites run against Postgres in process (PGlite), so
      # no service container is needed.
      - run: npm test

      # The runner's isolation tests need root — to drop each run to its own
      # uid and enter fresh namespaces — so the suite runs again under sudo,
      # where the cases skipped above actually execute.
      - run: sudo -E env "PATH=$PATH" npx vitest run
        working-directory: packages/runner

      - run: npm run build -w @parikshaa/web
      - run: npm run build -w @parikshaa/console

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: false
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  # ROADMAP §13: the product in real browsers against a real Postgres, then
  # killed mid-write, then under load. Slower than `check`, so its own job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The roles the harnesses expect. The owner may terminate the runtime
      # role's connections, which the chaos run does on purpose; the backup
      # role bypasses row-level security, which a dump of the ledger needs.
      - name: Database and roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE parikshaa_owner LOGIN PASSWORD 'owner-e2e'" \
            -c "CREATE ROLE parikshaa_app LOGIN PASSWORD 'app-e2e'" \
            -c "GRANT pg_signal_backend TO parikshaa_owner" \
            -c "CREATE ROLE parikshaa_backup LOGIN PASSWORD 'backup-e2e' BYPASSRLS" \
            -c "GRANT pg_read_all_data TO parikshaa_backup" \
            -c "CREATE DATABASE parikshaa_e2e OWNER parikshaa_owner"

      - run: npm run build && npm run build:clients && npm run build -w @parikshaa/e2e

      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/e2e

      - run: npx playwright test
        working-directory: packages/e2e

      - run: npm run chaos -w @parikshaa/e2e -- 60 3

      # A smaller cohort than the documented 1,000-candidate run, to fit a CI
      # runner's two cores; fails on any error or broken chain.
      - run: npm run load -w @parikshaa/e2e -- 300 1 500 8

      - name: Restore drill
        run: |
          SOURCE_URL=postgres://parikshaa_backup:backup-e2e@localhost:5432/parikshaa_e2e \
          ADMIN_URL=postgres://postgres:postgres@localhost:5432/postgres \
          ./scripts/restore-drill.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
