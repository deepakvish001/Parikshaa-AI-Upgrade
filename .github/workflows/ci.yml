name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks every package, test files included.
      - run: npm run typecheck

      # Every colour, font size, weight and radius comes from the design tokens.
      - run: npm run lint:css

      # The store and api suites run against Postgres in process (PGlite), so
      # no service container is needed.
      - run: npm test

      # The runner's isolation tests need root — to drop each run to its own
      # uid and enter fresh namespaces — so the suite runs again under sudo,
      # where the cases skipped above actually execute.
      - run: sudo -E env "PATH=$PATH" npx vitest run
        working-directory: packages/runner

      - run: npm run build -w @parikshaa/web
      - run: npm run build -w @parikshaa/console

      # Each built file against its gzipped budget (bundle-budget.json): the
      # candidate's first download is what a slow phone waits on.
      - run: npm run budget

  # ROADMAP §11: nothing secret in the history, and no known-vulnerable
  # dependency in what ships.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret committed and then deleted is still leaked.
          fetch-depth: 0

      # Gitleaks, pinned and checked against its published checksum rather than
      # a third-party action with repository access.
      - name: Secret scan
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # What runs in production: high or critical fails the build. Development
      # tooling (the Vite dev server, the test runner) never reaches a
      # candidate, and is reported by Dependabot instead.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Dependency review needs GitHub Advanced Security on a private
      # repository, and errors out without it. It runs on public repositories,
      # or once the repository variable DEPENDENCY_REVIEW is set to 'true'.
      - name: Dependency review
        if: >-
          github.event_name == 'pull_request' &&
          (!github.event.repository.private || vars.DEPENDENCY_REVIEW == 'true')
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          push: false
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  # docs/DEPLOY-AWS.md: the AWS setup is code, held to what it promises
  # without an AWS account. The Terraform is formatted and valid, its tests
  # (provider mocked) check who may reach whom and what production keeps, and
  # the deploy scripts pass shellcheck and their tests against a fake AWS.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and checked against HashiCorp's published checksum.
      - name: Terraform
        run: |
          curl -sSfL -o terraform.zip https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip
          echo "dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df  terraform.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/terraform-plugins"
          unzip -q terraform.zip terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          # One download of the AWS provider for every directory below.
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugins" >>"$GITHUB_ENV"

      - run: terraform fmt -check -recursive deploy/aws

      - name: Validate and test
        working-directory: deploy/aws
        run: |
          for dir in bootstrap pilot envs/staging envs/production; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
          # The stack needs its Hyderabad provider from an environment, so it
          # is validated above through them and tested here on its own.
          terraform -chdir=modules/stack init -backend=false -input=false >/dev/null
          terraform -chdir=pilot test
          terraform -chdir=modules/stack test

      - name: Shellcheck
        working-directory: deploy/aws
        run: |
          shellcheck -x -P modules/stack/host modules/stack/host/bootstrap.sh modules/stack/host/parikshaa-* \
            scripts/*.sh scripts/test/scripts.test.sh scripts/test/fake/*
          # Terraform fills ${…} in the template, quotes or not.
          shellcheck --shell=bash -e SC2154,SC2016 pilot/user-data.sh.tftpl

      - run: deploy/aws/scripts/test/scripts.test.sh

      # The machine for the API alone, with Supabase and Vercel (docs/STAGING.md).
      - name: Setup script
        run: |
          shellcheck -x scripts/setup-server.sh scripts/test/setup-server.test.sh
          scripts/test/setup-server.test.sh

      # The Judge0 VM (G3): cgroup v1, secrets, the purge, the check.
      - name: Judge0 setup script
        run: |
          shellcheck -x deploy/judge0/setup-judge0.sh deploy/judge0/test/setup-judge0.test.sh
          deploy/judge0/test/setup-judge0.test.sh
          sed 's|/etc/parikshaa/judge0.secrets.conf|judge0.conf|' deploy/judge0/docker-compose.yml > /tmp/judge0-compose.yml
          cp deploy/judge0/judge0.conf /tmp/ && docker compose -f /tmp/judge0-compose.yml config -q

  # ROADMAP §13: the product in real browsers against a real Postgres, then
  # killed mid-write, then under load. Slower than `check`, so its own job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway database on the runner: no password to keep, and none in the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The roles the harnesses expect. The owner may terminate the runtime
      # role's connections, which the chaos run does on purpose; the backup
      # role bypasses row-level security, which a dump of the ledger needs.
      - name: Database and roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE parikshaa_owner LOGIN" \
            -c "CREATE ROLE parikshaa_app LOGIN" \
            -c "GRANT pg_signal_backend TO parikshaa_owner" \
            -c "CREATE ROLE parikshaa_backup LOGIN BYPASSRLS" \
            -c "GRANT pg_read_all_data TO parikshaa_backup" \
            -c "CREATE DATABASE parikshaa_e2e OWNER parikshaa_owner"

      - run: npm run build && npm run build:clients && npm run build -w @parikshaa/e2e

      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/e2e

      - run: npx playwright test
        working-directory: packages/e2e

      # Screens held to their committed images (visual/__screenshots__): a
      # change to how anything looks fails until the images are updated on
      # purpose with `npm run visual:update -w @parikshaa/e2e`.
      - run: npm run visual -w @parikshaa/e2e

      # Lighthouse's mobile run — a mid-range phone on slow 4G — on the pages
      # candidates and recruiters open first; each category holds its floor.
      - run: npm run perf -w @parikshaa/e2e

      - run: npm run chaos -w @parikshaa/e2e -- 60 3

      # A smaller cohort than the documented 1,000-candidate run, to fit a CI
      # runner's two cores; fails on any error or broken chain.
      - run: npm run load -w @parikshaa/e2e -- 300 1 500 8

      - name: Restore drill
        run: |
          SOURCE_URL=postgres://parikshaa_backup@localhost:5432/parikshaa_e2e \
          ADMIN_URL=postgres://postgres@localhost:5432/postgres \
          ./scripts/restore-drill.sh

      # docs/DEPLOY-AWS.md, "Pilot se RDS": the pilot's database moved into a
      # new server shaped like RDS: no parikshaa_app yet, and the schema's
      # owner a login with CREATEROLE but no superuser, as RDS's master user
      # is. The migrations then find nothing to do but the app's password,
      # every chain verifies, and the app can log in.
      - name: Import as RDS would
        run: |
          docker run -d --name rds -p 5499:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          for _ in $(seq 1 30); do pg_isready -q -h localhost -p 5499 && break; sleep 2; done
          psql -h localhost -p 5499 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE parikshaa_owner LOGIN CREATEROLE CREATEDB" \
            -c "CREATE DATABASE parikshaa OWNER parikshaa_owner"
          pg_dump --format=custom --file=pilot.dump postgres://parikshaa_backup@localhost:5432/parikshaa_e2e
          export OWNER_URL=postgres://parikshaa_owner@localhost:5499/parikshaa
          app_password="$(openssl rand -hex 16)"
          ./deploy/aws/scripts/import-dump.sh pilot.dump
          DATABASE_URL="$OWNER_URL" PARIKSHAA_APP_PASSWORD="$app_password" node packages/store/dist/migrate-cli.js | tee migrate.log
          grep -q "^0 migration(s) applied" migrate.log
          DATABASE_URL="$OWNER_URL" node packages/api/dist/verify-all-cli.js
          PGPASSWORD="$app_password" psql -h localhost -p 5499 -U parikshaa_app -d parikshaa -v ON_ERROR_STOP=1 -qc "SELECT 1"
          # A second import into a database that has data is refused.
          if ./deploy/aws/scripts/import-dump.sh pilot.dump; then
            echo "imported into a database that already had data"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/visual-report
            packages/e2e/test-results
          retention-days: 7
