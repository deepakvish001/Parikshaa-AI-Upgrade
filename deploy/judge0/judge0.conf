# Judge0 settings for Parikshaa (docs/F1-GO-LIVE-PLAN.md §5.2, G3).
#
# This file holds no secret. setup-judge0.sh writes the passwords and the token
# into /etc/parikshaa/judge0.secrets.conf on the Judge0 VM, which the
# containers read after this file; nothing secret is ever committed.
#
# Judge0 only runs a program on stdin within limits. Parikshaa judges the
# output itself, so everything a submission could use to reach out, call
# back, or change how it is run is switched off.

# --- who may call it ---------------------------------------------------------
# Every request needs X-Auth-Token (AUTHN_TOKEN, in the secrets file). Judge0
# listens on the VM's private address only, and its security group lets only
# the API VM reach port 2358. (Judge0's ALLOW_IP is not used: it would also
# refuse the setup script's own check from the VM.)
AUTHN_HEADER=X-Auth-Token
AUTHZ_HEADER=X-Auth-User
USE_DOCS_AS_HOMEPAGE=false
MAINTENANCE_MODE=false

# --- nothing goes out ----------------------------------------------------------
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_COMPILER_OPTIONS=false

# --- how Parikshaa calls it: batches, then polling by token ----------------------
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
ENABLE_WAIT_RESULT=false
MAX_QUEUE_SIZE=2000
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=1
REDIRECT_STDERR_TO_STDOUT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# --- limits: the runner's own (packages/runner/src/execute.ts) ----------------------
# A test: 2 s and 256 MB unless the question says otherwise, at most 10 s and
# 1 GB. A question's checker: 5 s and 512 MB.
CPU_TIME_LIMIT=2
CPU_EXTRA_TIME=0.5
MAX_CPU_TIME_LIMIT=10
MAX_CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=2
MAX_WALL_TIME_LIMIT=10
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=1048576
STACK_LIMIT=65536
MAX_STACK_LIMIT=262144
MAX_PROCESSES_AND_OR_THREADS=128
MAX_MAX_PROCESSES_AND_OR_THREADS=128
# Memory is counted for the whole box by its cgroup, not per process by
# address space, so the JVM and Node can run under it (why Judge0 needs
# cgroup v1).
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
# Output past 1 MB stops the program, as the in-house runner does.
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=1024

# --- its own queue and database, on this VM only ----------------------------------
# Not Parikshaa's database: Judge0 keeps a submission only until the hourly
# purge (setup-judge0.sh) deletes it.
REDIS_HOST=redis
REDIS_PORT=6379
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0

# Workers per worker container; match the VM's vCPUs.
COUNT=4
INTERVAL=0.1
RAILS_ENV=production
RAILS_MAX_THREADS=8
RAILS_SERVER_PROCESSES=2
